[package]
name = "validator"
version = "0.1.0"
edition = "2021"

[dependencies]
harness-protocol = { path = "../harness-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
interprocess = "2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
chrono = { version = "0.4", features = ["serde"] }
