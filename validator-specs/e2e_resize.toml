[meta]
name = "e2e_resize"
tier = "scripted"
timeout_ms = 12000
description = "Select a region, then drag SE corner to enlarge"

[setup]
save_path = "/tmp/validator-e2e-resize.png"
format = "png"

[[steps]]
kind = "wait_for"
event = "started"
timeout_ms = 3000

# Free-select a small region
[[steps]]
kind = "drag"
from = [500.0, 500.0]
to = [600.0, 600.0]
mode = "scripted"

[[steps]]
kind = "wait_for"
event = "regionSelected"
timeout_ms = 2000

# Drag the SE corner handle outward by 100px
[[steps]]
kind = "drag"
from = [600.0, 600.0]
to = [700.0, 700.0]
mode = "scripted"

[[steps]]
kind = "sleep"
ms = 500

[[steps]]
kind = "save"
mode = "scripted"

[[steps]]
kind = "wait_for"
event = "saved"
timeout_ms = 3000

[[asserts]]
kind = "event_emitted"
event = "regionSelected"

[[asserts]]
kind = "event_emitted"
event = "saved"

[[asserts]]
kind = "artifact_exists"
path = "/tmp/validator-e2e-resize.png"

[[asserts]]
kind = "artifact_dimensions"
path = "/tmp/validator-e2e-resize.png"
width = 200
height = 200
