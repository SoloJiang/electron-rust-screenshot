[meta]
name = "e2e_cancel"
tier = "scripted"
timeout_ms = 8000
description = "Click to start selection, then Escape to cancel"

[setup]
save_path = "/tmp/validator-e2e-cancel.png"
format = "png"

[[steps]]
kind = "wait_for"
event = "started"
timeout_ms = 3000

[[steps]]
kind = "mouse_down"
x = 500.0
y = 500.0

[[steps]]
kind = "sleep"
ms = 200

[[steps]]
kind = "key_press"
key = "Escape"

[[steps]]
kind = "wait_for"
event = "cancelled"
timeout_ms = 2000

[[asserts]]
kind = "event_emitted"
event = "started"

[[asserts]]
kind = "event_emitted"
event = "cancelled"

[[asserts]]
kind = "no_event"
event = "saved"
