[package]
name = "electron-rust-screenshot"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", default-features = false, features = ["napi9"] }
napi-derive = "2.16"
winit = "0.30"
egui = "0.28"
egui_glow = "0.28"
glow = "0.13"
glutin = "0.31"
glutin-winit = "0.4"
raw-window-handle = "0.6"
rstar = "0.12"
uuid = { version = "1.8", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
sysinfo = "0.30"
parking_lot = "0.12"
crossbeam-channel = "0.5"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"
foreign-types = "0.5"
objc = "0.2"
cocoa = "0.26"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.56", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
